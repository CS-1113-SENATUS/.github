  <!-- divider below MXCIII -->
  <line x1="150" y1="274" x2="290" y2="274" stroke="#c9a13c" stroke-width="2"/>

  <!-- "SENATVS" -->
  <text x="220" y="306" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
